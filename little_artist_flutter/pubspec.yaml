name: little_artist
description: Archive and celebrate children's artwork.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database (Drift - SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path: ^1.9.1

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_vertexai: ^1.2.0

  # Auth providers
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.2.2
  crypto: ^3.0.6

  # Media
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Audio
  record: ^5.2.0
  just_audio: ^0.9.43

  # PDF
  pdf: ^3.11.2
  printing: ^5.13.5

  # Notifications
  flutter_local_notifications: ^18.0.1

  # IAP
  in_app_purchase: ^3.2.0

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.19.0
  timezone: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
